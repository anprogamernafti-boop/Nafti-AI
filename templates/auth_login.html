<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Connexion - Nafti AI</title><link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"><style>
:root{--bg:#f4f7fb;--card:#fff;--text:#171b24;--muted:#687389;--brand:#0a8f94;--sun:#c79b3b;--border:rgba(0,0,0,.08);--shadow:0 18px 44px rgba(12,20,36,.10)}*{box-sizing:border-box;margin:0;padding:0}body{font-family:'DM Sans',sans-serif;color:var(--text);background:radial-gradient(circle at 15% 5%,rgba(10,143,148,.18),transparent 30%),var(--bg)}.wrap{min-height:100vh;display:grid;place-items:center;padding:20px}.card{width:min(100%,460px);background:var(--card);border:1px solid var(--border);border-radius:18px;box-shadow:var(--shadow);padding:20px}.logo{font-family:Sora,sans-serif;font-size:30px;font-weight:800;margin-bottom:2px}.sub{color:var(--muted);margin-bottom:14px}.tabs{display:flex;gap:8px;margin-bottom:12px}.tab{flex:1;padding:10px;border:1px solid var(--border);border-radius:10px;background:#fff;cursor:pointer;font-weight:700}.tab.active{background:linear-gradient(130deg,var(--brand),var(--sun));color:#fff;border:0}
form{display:none}form.active{display:block}input{width:100%;padding:11px 12px;border:1px solid var(--border);border-radius:10px;margin-bottom:8px}.btn{width:100%;padding:11px 12px;border:0;border-radius:10px;cursor:pointer;font-weight:700}.main{background:linear-gradient(130deg,var(--brand),var(--sun));color:#fff}.google{display:flex;justify-content:center;align-items:center;gap:8px;background:#fff;border:1px solid var(--border);color:#222;text-decoration:none;margin-top:10px;padding:11px;border-radius:10px;font-weight:700}.disabled{opacity:.6;pointer-events:none}.back{display:inline-block;margin-top:12px;color:var(--muted);text-decoration:none}
</style></head><body><div class="wrap"><div class="card"><div class="logo">Nafti AI</div><div class="sub">Connectez-vous pour continuer</div><div class="tabs"><button class="tab active" onclick="toggle('login',this)">Connexion</button><button class="tab" onclick="toggle('signup',this)">Inscription</button></div><form id="login" class="active" action="/login" method="POST"><input type="email" name="email" required placeholder="Email"><input type="password" name="password" required placeholder="Mot de passe"><button class="btn main" type="submit">Se connecter</button></form><form id="signup" action="/register" method="POST"><input type="email" name="email" required placeholder="Email"><input type="password" name="password" required placeholder="Mot de passe"><button class="btn main" type="submit">Créer un compte</button></form>{% if google_oauth_enabled and google_login_url %}<a class="google" href="{{ google_login_url }}"><i class="fa-brands fa-google"></i> Continuer avec Google</a>{% else %}<div class="google disabled"><i class="fa-brands fa-google"></i> Google indisponible (credentials manquants)</div>{% endif %}<a class="back" href="/">← Retour à l’accueil</a></div></div><script>function toggle(id,btn){document.querySelectorAll('form').forEach(f=>f.classList.remove('active'));document.getElementById(id).classList.add('active');document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));btn.classList.add('active');}</script></body></html>
