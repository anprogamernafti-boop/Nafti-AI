<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }} - Nafti AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root {
            --bg-primary: #F5F5F7;
            --bg-chat: #FFFFFF;
            --text-primary: #1D1D1F;
            --text-secondary: #6E6E73;
            --text-muted: #AEAEB2;
            --accent: #0A8F94;
            --accent-light: #0FC2C8;
            --accent-glow: rgba(10,143,148,0.12);
            --gold: #C79B3B;
            --border: rgba(0,0,0,0.06);
            --shadow: 0 4px 24px rgba(0,0,0,0.06);
            --shadow-lg: 0 12px 48px rgba(0,0,0,0.1);
            --code-bg: #1E1E2E;
            --code-text: #CDD6F4;
            --ai-bubble: #FFFFFF;
            --ai-text: #1D1D1F;
            --user-bubble: linear-gradient(135deg, #0A8F94, #0FC2C8);
            --user-text: #FFFFFF;
            --radius-lg: 24px;
            --radius-md: 16px;
            --radius-sm: 12px;
        }

        html.dark {
            --bg-primary: #0C0C0E;
            --bg-chat: #18181B;
            --text-primary: #F4F4F5;
            --text-secondary: #A1A1AA;
            --text-muted: #52525B;
            --accent: #22D3EE;
            --accent-light: #67E8F9;
            --accent-glow: rgba(34,211,238,0.1);
            --gold: #F59E0B;
            --border: rgba(255,255,255,0.06);
            --shadow: 0 4px 24px rgba(0,0,0,0.25);
            --code-bg: #09090B;
            --code-text: #A5F3FC;
            --ai-bubble: #1E1E23;
            --ai-text: #E4E4E7;
            --user-bubble: linear-gradient(135deg, #0891B2, #22D3EE);
            --user-text: #0C0C0E;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            display: flex;
            flex-direction: column;
            min-height: 100dvh;
            -webkit-font-smoothing: antialiased;
        }

        .header {
            padding: 16px;
            border-bottom: 1px solid var(--border);
            background: var(--bg-chat);
            box-shadow: var(--shadow);
        }

        .header-content {
            max-width: 800px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .header h1 {
            font-size: 20px;
            font-weight: 800;
            letter-spacing: -0.4px;
            flex: 1;
        }

        .header-btn {
            padding: 8px 16px;
            border-radius: var(--radius-md);
            border: 1.5px solid var(--border);
            background: var(--bg-primary);
            color: var(--text-secondary);
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .header-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
            background: var(--accent-glow);
        }

        .chat-area {
            flex: 1;
            overflow-y: auto;
            padding: 20px 16px;
            max-width: 800px;
            margin: 0 auto;
            width: 100%;
        }

        .message-group {
            display: flex;
            flex-direction: column;
            margin-bottom: 16px;
            animation: msgIn 0.35s cubic-bezier(0.22, 1, 0.36, 1);
        }

        @keyframes msgIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message-group.user { align-items: flex-end; }
        .message-group.ai { align-items: flex-start; }

        .message-bubble {
            max-width: 85%;
            padding: 14px 18px;
            border-radius: var(--radius-lg);
            line-height: 1.6;
            font-size: 15px;
            word-wrap: break-word;
            overflow-wrap: break-word;
        }

        .message-group.user .message-bubble {
            background: var(--user-bubble);
            color: var(--user-text);
            border-bottom-right-radius: 8px;
            font-weight: 500;
            box-shadow: 0 4px 16px rgba(10,143,148,0.2);
        }

        .message-group.ai .message-bubble {
            background: var(--ai-bubble);
            color: var(--ai-text);
            border-bottom-left-radius: 8px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
        }

        .message-bubble p { margin-bottom: 10px; }
        .message-bubble p:last-child { margin-bottom: 0; }
        .message-bubble strong { font-weight: 700; }
        .message-bubble em { font-style: italic; }

        .message-bubble code {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85em;
            background: var(--code-bg);
            color: var(--code-text);
            padding: 2px 7px;
            border-radius: 6px;
        }

        .message-bubble pre {
            background: var(--code-bg);
            border-radius: var(--radius-sm);
            padding: 14px 16px;
            margin: 10px 0;
            overflow-x: auto;
            position: relative;
        }

        .message-bubble pre code {
            background: none;
            padding: 0;
            font-size: 13px;
            line-height: 1.55;
        }

        .copy-code-btn {
            position: absolute;
            top: 8px;
            right: 8px;
            padding: 6px 12px;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
            opacity: 0;
            transition: opacity 0.2s ease;
            font-weight: 600;
        }

        .message-bubble pre:hover .copy-code-btn { opacity: 1; }
        .copy-code-btn:hover { background: var(--accent-light); }

        .message-bubble blockquote {
            border-left: 3px solid var(--gold);
            padding-left: 14px;
            margin: 10px 0;
            color: var(--text-secondary);
            font-style: italic;
        }

        .message-bubble a {
            color: var(--accent);
            text-decoration: underline;
            text-underline-offset: 2px;
        }

        .message-bubble table {
            border-collapse: collapse;
            width: 100%;
            margin: 10px 0;
            font-size: 14px;
        }

        .message-bubble th, .message-bubble td {
            border: 1px solid var(--border);
            padding: 8px 12px;
            text-align: left;
        }

        .message-bubble th {
            background: var(--accent-glow);
            font-weight: 700;
        }

        .footer {
            padding: 16px;
            border-top: 1px solid var(--border);
            background: var(--bg-chat);
            text-align: center;
            font-size: 12px;
            color: var(--text-muted);
        }

        @media (max-width: 600px) {
            .header-content { flex-wrap: wrap; }
            .header h1 { font-size: 16px; }
            .message-bubble { max-width: 90%; }
            .chat-area { padding: 12px 8px; }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-content">
            <h1>{{ title }}</h1>
            <a href="/" class="header-btn" title="Retour au chat">
                <i class="fa-solid fa-arrow-left"></i> Accueil
            </a>
        </div>
    </div>

    <div class="chat-area" id="chatArea">
        <!-- Messages inserted by JavaScript -->
    </div>

    <div class="footer">
        <p>💬 Conversation partagée depuis Nafti AI</p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script>
        // Theme sync
        (function() {
            try {
                const saved = localStorage.getItem('nafti-theme');
                if (saved === 'dark' || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                    document.documentElement.classList.add('dark');
                }
            } catch(e) {}
        })();

        // Messages from template
        const messages = JSON.parse('{{ messages | tojson }}');

        function renderMarkdown(text) {
            return marked.parse(text);
        }

        function renderMessages() {
            const chatArea = document.getElementById('chatArea');
            
            messages.forEach(msg => {
                const group = document.createElement('div');
                group.className = `message-group ${msg.role}`;

                const bubble = document.createElement('div');
                bubble.className = 'message-bubble';
                
                if (msg.role === 'user') {
                    bubble.textContent = msg.content;
                } else {
                    bubble.innerHTML = renderMarkdown(msg.content);
                    // Add copy buttons to code blocks
                    bubble.querySelectorAll('pre').forEach(pre => {
                        const copyBtn = document.createElement('button');
                        copyBtn.className = 'copy-code-btn';
                        copyBtn.textContent = 'Copier';
                        copyBtn.onclick = function(e) {
                            e.stopPropagation();
                            const code = pre.querySelector('code').textContent;
                            navigator.clipboard.writeText(code).then(() => {
                                copyBtn.textContent = 'Copié!';
                                setTimeout(() => copyBtn.textContent = 'Copier', 2000);
                            });
                        };
                        pre.style.position = 'relative';
                        pre.appendChild(copyBtn);
                    });
                }

                group.appendChild(bubble);
                chatArea.appendChild(group);
            });
        }

        renderMessages();
    </script>
</body>
</html>
